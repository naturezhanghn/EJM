# # network structures
# network_g:
#   type: Restormer
#   inp_channels: 1
#   out_channels: 1
#   dim: 48
#   num_blocks: [2,3,3,4] # 4 6 6 8
#   num_refinement_blocks: 4
#   heads: [1,2,4,8]
#   ffn_expansion_factor: 2.66
#   bias: False
#   LayerNorm_type: WithBias
#   dual_pixel_task: False

# network_g:
#   type: MIRNet_v2
#   inp_channels: 1
#   out_channels: 1

network_g:
  type: fftformer
  inp_channels: 1
  out_channels: 1
  dim: 48
  num_blocks: [6,6,12]
  num_refinement_blocks: 4
  ffn_expansion_factor: 3
  bias: False


# path
path:
  pretrain_network_g: /raid/chenzd/project/restore_sateline/experiments/Deblurring_fftformer_20230716_480x640Dv1plus20uv_perceptual_fft/models/net_g_latest.pth
  strict_load_g: true
  resume_state: ~

# validation settings
val:
  save_img: false

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim: # metric name, can be arbitrary
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
  # metrics:
  #   lpips: # metric name, can be arbitrary
  #     type: calculate_lpips
  #     crop_border: 0
  #     test_y_channel: false

# dist training settings
dist_params:
  backend: nccl
  port: 29500
