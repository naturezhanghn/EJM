# general settings
name: test_NAFCoAFFTSKFF2NetLocal_480x640Dv1plus20uv
model_type: ImageMlossModel
scale: 1
num_gpu: 1 # set num_gpu: 0 for cpu mode
manual_seed: 100

# dataset and data loader settings
datasets:
  # train:
  #   name: TrainSet
  #   type: REMOTEDATASetWarp
  #   dataroot_gt: /data/zhangzr/tdi_dataset/data/TDI_dataset_td_2023_04_18_480x640Dv1_plus_20_uv/TDI_dataset_td/tdi_dataset/val
  #   geometric_augs: true

  #   filename_tmpl: '{}'
  #   io_backend:
  #     type: disk

  #   # data loader
  #   use_shuffle: true
  #   num_worker_per_gpu: 2
  #   batch_size_per_gpu: 8

  #   ### -------------Progressive training--------------------------
  #   # mini_batch_sizes: [8,5,4,2,1,1]             # Batch size per gpu   
  #   # iters: [92000,64000,48000,36000,36000,24000]
  #   # gt_size: 384   # Max patch size for progressive training
  #   # gt_sizes: [128,160,192,256,320,384]  # Patch sizes for progressive training.
  #   ### ------------------------------------------------------------

  #   ### ------- Training on single fixed-patch size 128x128---------
  #   # mini_batch_sizes: [8,5,4,2,2,2]   
  #   # iters: [92000,64000,48000,36000,36000,24000]
  #   # gt_size: 384 
  #   # gt_sizes: [128,160,192,256,320,384]
  #   mini_batch_sizes: [4]   
  #   iters: [300000]
  #   gt_size: 480   
  #   gt_sizes: [128]
  #   ### ------------------------------------------------------------

  #   dataset_enlarge_ratio: 1
  #   prefetch_mode: ~
  test:
    name: ValSet
    type: REMOTEDATASetWarp
    dataroot_gt: /data/zhangzr/tdi_dataset/data/TDI_dataset_td_2023_04_18_480x640Dv1_plus_20_uv/TDI_dataset_td/tdi_dataset/val
    # /cold_data/zhangzr/project/origin_data/TDI_dataset_td_2023_03_06/TDI_dataset_td/tdi_dataset/val
    #/cold_data/zhangzr/project/origin_data/TDI_dataset_td_2022_12_12/tdi_dataset/test
    # dataroot_lq: ./Motion_Deblurring/Datasets/val/GoPro/input_crops
    io_backend:
      type: disk

# network structures
network_g:
  type: NAFCoAFFTSKFF2NetLocal
  img_channel: 1
  width: 64
  middle_blk_num: 12
  enc_blk_nums: [2, 2, 4, 8]
  dec_blk_nums: [2, 2, 2, 2]
  window_size_e_fft: [64, -1, -1, -1]
  base_size: 256

# path
path:
  #pretrain_network_g: /workspace/workspace/chenzd/project/restore_sateline/experiments/(for local inference)Deblurring_NAFNet_20230615_480x640Dv1plus20uv_perceptual/models/net_g_8.pth
  pretrain_network_g: /workspace/workspace/chenzd/project/restore_sateline/experiments/Deblurring_NAFCoAFFTSKFF2Net_20230619_480x640Dv1plus20uv_perceptual_fft/models/net_g_latest.pth
  strict_load_g: true
  resume_state: ~
  param_key: params

# validation settings
val:
  save_img: false
  grids: false

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# dist training settings
dist_params:
  backend: nccl
  port: 29500
