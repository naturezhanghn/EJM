# general settings
name: Deblurring_NAFNet_20230724_480x640Dv1plus20uv_perceptual_fft
model_type: ImageMlossModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: REMOTEDATASetWarp
    dataroot_gt: /raid/chenzd/dataset/TDI_dataset_td_2023_04_18_480x640Dv1_plus_20_uv/TDI_dataset_td/tdi_dataset/train
    # dataroot_gt: /workspace/workspace/chenzd/project/restore_sateline/TDI_dataset_td_TDIv2/tdi_dataset/train
    #/cold_data/zhangzr/project/origin_data/TDI_dataset_td_2023_03_06/TDI_dataset_td/tdi_dataset/train 
    #/cold_data/zhangzr/project/origin_data/TDI_dataset_td_2022_12_12/tdi_dataset/train
    # dataroot_lq: ./Motion_Deblurring/Datasets/train/GoPro/input_crops
    geometric_augs: true

    filename_tmpl: '{}'
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 8

    ### -------------Progressive training--------------------------
    # mini_batch_sizes: [8,5,4,2,1,1]             # Batch size per gpu   
    # iters: [92000,64000,48000,36000,36000,24000]
    # gt_size: 384   # Max patch size for progressive training
    # gt_sizes: [128,160,192,256,320,384]  # Patch sizes for progressive training.
    ### ------------------------------------------------------------

    ### ------- Training on single fixed-patch size 128x128---------
    # mini_batch_sizes: [8,5,4,2,2,2]   
    # iters: [92000,64000,48000,36000,36000,24000]
    # gt_size: 384 
    # gt_sizes: [128,160,192,256,320,384]
    mini_batch_sizes: [4]   
    iters: [300000]
    gt_size: 480   
    gt_sizes: [128]
    ### ------------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: REMOTEDATASetWarp
    dataroot_gt: /raid/chenzd/dataset/TDI_dataset_td_2023_04_18_480x640Dv1_plus_20_uv/TDI_dataset_td/tdi_dataset/val
    # /cold_data/zhangzr/project/origin_data/TDI_dataset_td_2023_03_06/TDI_dataset_td/tdi_dataset/val
    #/cold_data/zhangzr/project/origin_data/TDI_dataset_td_2022_12_12/tdi_dataset/test
    # dataroot_lq: ./Motion_Deblurring/Datasets/val/GoPro/input_crops
    io_backend:
      type: disk

# # network structures
# network_g:
#   type: Restormer
#   inp_channels: 1
#   out_channels: 1
#   dim: 48
#   num_blocks: [2,3,3,4] # 4 6 6 8
#   num_refinement_blocks: 4
#   heads: [1,2,4,8]
#   ffn_expansion_factor: 2.66
#   bias: False
#   LayerNorm_type: WithBias
#   dual_pixel_task: False

# network_g:
#   type: MIRNet_v2
#   inp_channels: 1
#   out_channels: 1

network_g:
  type: NAFNet
  img_channel: 1
  width: 32
  # middle_blk_num: 12
  # enc_blk_nums: [2, 2, 4, 8]
  # dec_blk_nums: [2, 2, 2, 2]
  middle_blk_num: 1
  enc_blk_nums: [1, 1, 1, 28]
  dec_blk_nums: [1, 1, 1, 1]
  # window_size_e_fft: [64, -1, -1, -1]
  # out_channels: 1
  # base_size: 192
  # new line


# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 300000
  warmup_iter: 0 # no warm up -1 
  use_grad_clip: true

  # Split 300k iterations into two cycles. 
  # 1st cycle: fixed 3e-4 LR for 92k iters. 
  # 2nd cycle: cosine annealing (3e-4 to 1e-6) for 208k iters.
  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 300000
    eta_min: !!float 1e-7 
  
  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: !!float 1e-3
    betas: [0.9, 0.9]
  
  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

  # losses
  flow_opt:
    type: PerceptualLoss
    loss_weight: 0.0001
    reduction: mean

  # losses
  msfr_opt:
    type: FFTLoss
    loss_weight: 0.1
    reduction: mean

# validation settings
val:
  window_size: 8
  val_freq: !!float 5e4
  save_img: false
  save_last_img: false
  rgb2bgr: false #true
  use_image: true
  max_minibatch: 8

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 2e5
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
