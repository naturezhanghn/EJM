# general settings
name: tune_Deblurring_FNAFNet_20230802_480x640Dv1plus20uv_LAP_nowarp
model_type: ImageMlossModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: REMOTEDATASetNoWarp
    dataroot_gt: /data2/chenzd/TDI_dataset_td_2023_04_18_480x640Dv1_plus_20_uv/TDI_dataset_td/tdi_dataset/train
    filename_tmpl: '{}'
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 4

    mini_batch_sizes: [4]   
    iters: [150000] # 450000
    gt_size: 128  
    gt_sizes: [128]

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: REMOTEDATASetNoWarp
    dataroot_gt: /data2/chenzd/TDI_dataset_td_2023_04_18_480x640Dv1_plus_20_uv/TDI_dataset_td/tdi_dataset/val
    io_backend:
      type: disk

network_g:
  type: NAFFFTNetv2
  img_channel: 1
  width: 64
  middle_blk_num: 1
  enc_blk_nums: [1, 1, 1, 28]
  dec_blk_nums: [1, 1, 1, 1]
  window_size_e: [64, 32, 16, 8]
  window_size_e_fft: [64, -1, -1, -1]

# path
path:
  pretrain_network_g: /raid/chenzd/project/restore_sateline/experiments/Deblurring_FNAFNet_20230801_480x640Dv1plus20uv_LAP_nowarp/models/net_g_450000.pth
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 150000 # 450000
  warmup_iter: -1 # no warm up
  use_grad_clip: true

  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 150000 # 450000
    eta_min: !!float 1e-7

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 1e-7 # 3e-4
    weight_decay: !!float 1e-3
    betas: [0.9, 0.9]
  
  # losses
  pixel_opt:
    type: FreqLoss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  window_size: 8
  val_freq: !!float 1e4 # 5e4
  save_img: false
  save_last_img: true
  rgb2bgr: false #true
  use_image: true
  max_minibatch: 8

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim: # metric name, can be arbitrary
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
  # metrics:
  #   lpips: # metric name, can be arbitrary
  #     type: calculate_lpips
  #     crop_border: 0
  #     test_y_channel: false

# logging settings
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 1e4 # 5e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
