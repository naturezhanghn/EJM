# general settings
name: Deblurring_JRNet_20230803_480x640Dv1plus20uv_LAP_nowarp
model_type: ImageMlossModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: REMOTEDATASetNoWarp
    dataroot_gt: /data2/chenzd/TDI_dataset_td_2023_04_18_480x640Dv1_plus_20_uv/TDI_dataset_td/tdi_dataset/train
    filename_tmpl: '{}'
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 4

    mini_batch_sizes: [4]   
    iters: [450000] # 450000
    gt_size: 128   
    gt_sizes: [128]

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: REMOTEDATASetNoWarp
    dataroot_gt: /data2/chenzd/TDI_dataset_td_2023_04_18_480x640Dv1_plus_20_uv/TDI_dataset_td/tdi_dataset/val
    io_backend:
      type: disk

network_g:
  type: NAFCoAFFTNetv4
  img_channel: 1
  width: 32
  # middle_blk_num: 12
  # enc_blk_nums: [2, 2, 4, 8]
  # dec_blk_nums: [2, 2, 2, 2]

  # middle_blk_num: 8
  # enc_blk_nums: [2, 2, 4, 6]
  # dec_blk_nums: [6, 4, 2, 2] # No3

  # middle_blk_num: 4
  # enc_blk_nums: [2, 4, 4, 6]
  # dec_blk_nums: [6, 4, 4, 2] # No8

  middle_blk_num: 4
  enc_blk_nums: [4, 4, 4, 4]
  dec_blk_nums: [4, 4, 4, 4] # No9

  window_size_e_fft: [64, -1, -1, -1]

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 450000 # 450000
  warmup_iter: -1 # no warm up
  use_grad_clip: true

  # scheduler:
  #   type: CosineAnnealingRestartCyclicLR
  #   #periods: [92000, 208000, 150000]       
  #   periods: [450000, 150000]       
  #   # restart_weights: [1,1,0.0333] 
  #   restart_weights: [1, 0.003] 
  #   # eta_mins: [0.0003,0.00001, 0.0000001] 
  #   eta_mins: [0.000001, 0.0000001] 
  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 450000 # 450000
    eta_min: !!float 1e-7 

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-3
    betas: [0.9, 0.999]
  
  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

  flow_opt:
    type: PerceptualLoss
    loss_weight: 0.0001
    reduction: mean

  msfr_opt:
    type: FFTLoss
    loss_weight: 0.1
    reduction: mean

  #flow_weight: 0.1

# validation settings
val:
  window_size: 8
  val_freq: !!float 5e4
  save_img: false
  save_last_img: true
  rgb2bgr: false #true
  use_image: true
  max_minibatch: 8

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 5e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
