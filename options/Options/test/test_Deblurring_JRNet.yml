# general settings
name: test_Deblurring_JRNet_20230817_Dotav1test
model_type: ImageMlossFlowModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 100

# dataset and data loader settings
datasets:
  test:
    name: ValSet
    type: REMOTEDATASet
    dataroot_gt: /data2/chenzd/TDI_dataset_td_2023_04_18_480x640Dv1_plus_20_uv/TDI_dataset_td/tdi_dataset/test
    # dataroot_gt: /raid/chenzd/dataset/val2
    # dataroot_gt: /raid/chenzd/dataset/TDI_dataset_td_PatternNet/tdi_dataset/test
    io_backend:
      type: disk

# network_g:
#   type: NAFCoAFFTFlowNet
#   img_channel: 1
#   width: 32
#   middle_blk_num: 4
#   enc_blk_nums: [4, 4, 4, 4]
#   dec_blk_nums: [4, 4, 4, 4]
#   window_size_e_fft: [64, -1, -1, -1]
network_g:
  type: NAFCoAFFTFlowNet
  img_channel: 1
  width: 32
  middle_blk_num: 4
  enc_blk_nums: [4, 4, 4, 4]
  dec_blk_nums: [4, 4, 4, 4]
  window_size_e_fft: [64, -1, -1, -1]

# path
path:
  pretrain_network_g: /raid/chenzd/project/restore_sateline/experiments/Deblurring_JRNet_20230809_480x640Dv1plus20uv_LAP_retrain3/models/net_g_450000.pth
  strict_load_g: true
  resume_state: ~

# validation settings
val:
  save_img: false
  use_image: true

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim: # metric name, can be arbitrary
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
    # gmsd: # metric name, can be arbitrary
    #   type: calculate_gmsd #fsim2 #calculate_fsim
    # fsim: # metric name, can be arbitrary
    #   type: fsim2 #fsim2 #calculate_fsim

# dist training settings
dist_params:
  backend: nccl
  port: 29500
